version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: nazim_pos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=password123
      - DB_NAME=nazim_pos
    ports:
      - "5000:5000"
    depends_on:
      - mysql-db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: